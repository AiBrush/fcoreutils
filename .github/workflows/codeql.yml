name: "CodeQL Analysis"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

concurrency:
  group: codeql-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python, rust]

    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      # Autobuild is only needed for compiled languages (rust).
      # Python and Actions are interpreted/declarative — CodeQL analyzes
      # them directly without a build step.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
        if: matrix.language == 'rust'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
