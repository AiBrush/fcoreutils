name: Test

on:
  pull_request:
  merge_group:
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUSTFLAGS: ""

jobs:
  # Lint runs once on ubuntu — platform-independent checks
  # Skip on merge_group — lint already passed on the PR.
  lint:
    name: Lint
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          key: lint-v1
      - name: Install nasm and libssl-dev
        run: sudo apt-get install -y --no-install-recommends nasm libssl-dev
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Check formatting
        run: cargo fmt -- --check

  # ── Linux: build once, test each command in parallel ──────────────
  # Skip on merge_group — build already passed on the PR.
  build-linux:
    name: Build (ubuntu-latest)
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          shared-key: build-v2-ubuntu-latest
      - name: Install nasm and libssl-dev
        run: sudo apt-get install -y --no-install-recommends nasm libssl-dev
      - name: Build and compile tests
        run: cargo test --no-run

  # Binary tests: src/bin/f{cmd}.rs → cargo test --bin f{cmd}
  # Skip on merge_group — tests already passed on the PR.
  test-linux-bin:
    name: Test ubuntu/${{ matrix.cmd }}
    if: github.event_name != 'merge_group'
    needs: build-linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cmd: [arch, b2sum, base32, base64, basename, basenc, cat, chcon, chgrp, chmod, chown, chroot, cksum, comm, cp, csplit, cut, date, dd, df, dir, dircolors, dirname, du, echo, env, expand, expr, factor, false, fmt, fold, groups, head, hostid, id, install, join, kill, link, ln, logname, ls, md5sum, mkdir, mkfifo, mknod, mktemp, mv, nice, nl, nohup, nproc, numfmt, od, paste, pathchk, pinky, pr, printenv, printf, ptx, pwd, readlink, realpath, rev, rm, rmdir, runcon, seq, sha1sum, sha224sum, sha256sum, sha384sum, sha512sum, shred, shuf, sleep, sort, split, stat, stdbuf, stty, sum, sync, tac, tail, tee, test, timeout, touch, tr, true, truncate, tsort, tty, uname, unexpand, uniq, unlink, uptime, users, vdir, wc, who, whoami, yes]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          shared-key: build-v2-ubuntu-latest
          save-if: false
      - name: Install nasm and libssl-dev
        run: sudo apt-get install -y --no-install-recommends nasm libssl-dev
      - name: Run tests
        run: |
          cargo build --bin "f${{ matrix.cmd }}"
          cargo test --bin "f${{ matrix.cmd }}"

  # ── macOS: build once, test each command in parallel ──────────────
  # Skip on merge_group — build already passed on the PR.
  build-macos:
    name: Build (macos-latest)
    if: github.event_name != 'merge_group'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          shared-key: build-v2-macos-latest
      - name: Build and compile tests
        run: cargo test --no-run

  # Skip on merge_group — tests already passed on the PR.
  test-macos-bin:
    name: Test macos/${{ matrix.cmd }}
    if: github.event_name != 'merge_group'
    needs: build-macos
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        cmd: [arch, b2sum, base32, base64, basename, basenc, cat, chcon, chgrp, chmod, chown, chroot, cksum, comm, cp, csplit, cut, date, dd, df, dir, dircolors, dirname, du, echo, env, expand, expr, factor, false, fmt, fold, groups, head, hostid, id, install, join, kill, link, ln, logname, ls, md5sum, mkdir, mkfifo, mknod, mktemp, mv, nice, nl, nohup, nproc, numfmt, od, paste, pathchk, pinky, pr, printenv, printf, ptx, pwd, readlink, realpath, rev, rm, rmdir, runcon, seq, sha1sum, sha224sum, sha256sum, sha384sum, sha512sum, shred, shuf, sleep, sort, split, stat, stdbuf, stty, sum, sync, tac, tail, tee, test, timeout, touch, tr, true, truncate, tsort, tty, uname, unexpand, uniq, unlink, uptime, users, vdir, wc, who, whoami, yes]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          shared-key: build-v2-macos-latest
          save-if: false
      - name: Run tests
        run: |
          cargo build --bin "f${{ matrix.cmd }}"
          cargo test --bin "f${{ matrix.cmd }}"

  # ── Windows: build once, test each command in parallel ────────────
  # Skip on merge_group — build already passed on the PR.
  build-windows:
    name: Build (windows-latest)
    if: github.event_name != 'merge_group'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          shared-key: build-v2-windows-latest
      - name: Build and compile tests
        run: cargo test --no-run

  # Skip on merge_group — tests already passed on the PR.
  test-windows-bin:
    name: Test windows/${{ matrix.cmd }}
    if: github.event_name != 'merge_group'
    needs: build-windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        cmd: [arch, b2sum, base32, base64, basename, basenc, cat, chcon, chgrp, chmod, chown, chroot, cksum, comm, cp, csplit, cut, date, dd, df, dir, dircolors, dirname, du, echo, env, expand, expr, factor, false, fmt, fold, groups, head, hostid, id, install, join, kill, link, ln, logname, ls, md5sum, mkdir, mkfifo, mknod, mktemp, mv, nice, nl, nohup, nproc, numfmt, od, paste, pathchk, pinky, pr, printenv, printf, ptx, pwd, readlink, realpath, rev, rm, rmdir, runcon, seq, sha1sum, sha224sum, sha256sum, sha384sum, sha512sum, shred, shuf, sleep, sort, split, stat, stdbuf, stty, sum, sync, tac, tail, tee, test, timeout, touch, tr, true, truncate, tsort, tty, uname, unexpand, uniq, unlink, uptime, users, vdir, wc, who, whoami, yes]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
        with:
          shared-key: build-v2-windows-latest
          save-if: false
      - name: Run tests
        run: |
          cargo build --bin "f${{ matrix.cmd }}"
          cargo test --bin "f${{ matrix.cmd }}"

  # ── Gate: all platform tests must pass (use as required check) ────
  test-passed:
    name: Tests passed
    if: always()
    needs: [lint, test-linux-bin, test-macos-bin, test-windows-bin, assembly-test]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          EVENT_NAME: ${{ github.event_name }}
          LINT_RESULT: ${{ needs.lint.result }}
          LINUX_RESULT: ${{ needs.test-linux-bin.result }}
          MACOS_RESULT: ${{ needs.test-macos-bin.result }}
          WINDOWS_RESULT: ${{ needs.test-windows-bin.result }}
          ASSEMBLY_RESULT: ${{ needs.assembly-test.result }}
        run: |
          # On merge_group, tests are skipped (already passed on PR)
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            echo "Merge queue: skipping test checks (tests passed on PR)"
            exit 0
          fi
          results=("$LINT_RESULT" \
                   "$LINUX_RESULT" \
                   "$MACOS_RESULT" \
                   "$WINDOWS_RESULT" \
                   "$ASSEMBLY_RESULT")
          for r in "${results[@]}"; do
            if [[ "$r" != "success" ]]; then
              echo "Some tests failed: $r"
              exit 1
            fi
          done
          echo "All checks passed: lint, 107 command binary tests (3 platforms), assembly tests (64 tools)"

  # ── Required-check aliases (branch-protection expects these names) ──
  test-ubuntu:
    name: Test (ubuntu-latest)
    if: always()
    needs: [test-linux-bin]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        env:
          EVENT_NAME: ${{ github.event_name }}
          TEST_RESULT: ${{ needs.test-linux-bin.result }}
        run: |
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            echo "Merge queue: tests skipped (already passed on PR)"
            exit 0
          fi
          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "Linux tests failed"
            exit 1
          fi

  test-macos:
    name: Test (macos-latest)
    if: always()
    needs: [test-macos-bin]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        env:
          EVENT_NAME: ${{ github.event_name }}
          TEST_RESULT: ${{ needs.test-macos-bin.result }}
        run: |
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            echo "Merge queue: tests skipped (already passed on PR)"
            exit 0
          fi
          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "macOS tests failed"
            exit 1
          fi

  test-windows:
    name: Test (windows-latest)
    if: always()
    needs: [test-windows-bin]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        env:
          EVENT_NAME: ${{ github.event_name }}
          TEST_RESULT: ${{ needs.test-windows-bin.result }}
        run: |
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            echo "Merge queue: tests skipped (already passed on PR)"
            exit 0
          fi
          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "Windows tests failed"
            exit 1
          fi

  # ── Assembly: build all 46 tools once, upload as artifact ─────────
  # Skip on merge_group — tests already passed on the PR.
  assembly-build:
    name: Build assembly
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install nasm
        run: sudo apt-get install -y --no-install-recommends nasm
      - name: Build all assembly tools
        run: |
          set -e
          # fyes (Python build script)
          cd assembly/yes && python3 build.py --no-verify && cd ../..
          # NASM unified tools (flat binary)
          for tool in true logname hostid tty whoami pwd sync sleep echo env groups id ln rm mv cp chroot chcon runcon stty stdbuf pinky ptx numfmt dd csplit expr test install stat realpath dircolors printf mkdir mkfifo mknod mktemp chmod basename cksum dirname factor link nproc pathchk printenv readlink rmdir sum tee truncate uname unlink kill; do
            nasm -f bin assembly/$tool/f${tool}_unified.asm -o assembly/$tool/f$tool
            chmod +x assembly/$tool/f$tool
          done
          # NASM unified tools (unified/ subdirectory)
          for tool in head tail tac rev cut tr base64 md5sum sha224sum sha384sum base32 basenc join pr sha1sum sha256sum sha512sum shred shuf tsort b2sum split nohup touch uptime users who chown; do
            nasm -f bin assembly/$tool/unified/f${tool}_unified.asm -o assembly/$tool/f$tool
            chmod +x assembly/$tool/f$tool
          done
          # Modular ELF builds (tools with Makefile)
          for tool in wc cat expand false nl od seq sort unexpand uniq paste nice date timeout ls dir vdir du df comm fold; do
            make -C assembly/$tool dev
          done
          # arch (GAS syntax)
          as --64 assembly/arch/farch_unified.s -o /tmp/farch.o
          ld -o assembly/arch/farch /tmp/farch.o
          chmod +x assembly/arch/farch
          rm -f /tmp/farch.o
          echo "All 101 assembly tools built successfully"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: assembly-binaries
          path: |
            assembly/yes/fyes
            assembly/true/ftrue
            assembly/arch/farch
            assembly/logname/flogname
            assembly/hostid/fhostid
            assembly/tty/ftty
            assembly/whoami/fwhoami
            assembly/pwd/fpwd
            assembly/sync/fsync
            assembly/sleep/fsleep
            assembly/echo/fecho
            assembly/head/fhead
            assembly/tail/ftail
            assembly/tac/ftac
            assembly/rev/frev
            assembly/wc/fwc
            assembly/cut/fcut
            assembly/tr/ftr
            assembly/base64/fbase64
            assembly/md5sum/fmd5sum
            assembly/cat/fcat
            assembly/expand/fexpand
            assembly/false/ffalse
            assembly/nl/fnl
            assembly/od/fod
            assembly/seq/fseq
            assembly/sort/fsort
            assembly/unexpand/funexpand
            assembly/uniq/funiq
            assembly/paste/fpaste
            assembly/sha224sum/fsha224sum
            assembly/sha384sum/fsha384sum
            assembly/nice/fnice
            assembly/date/fdate
            assembly/timeout/ftimeout
            assembly/env/fenv
            assembly/groups/fgroups
            assembly/id/fid
            assembly/ln/fln
            assembly/rm/frm
            assembly/mv/fmv
            assembly/cp/fcp
            assembly/stat/fstat
            assembly/realpath/frealpath
            assembly/dircolors/fdircolors
            assembly/printf/fprintf
            assembly/chroot/fchroot
            assembly/chcon/fchcon
            assembly/runcon/fruncon
            assembly/stty/fstty
            assembly/stdbuf/fstdbuf
            assembly/pinky/fpinky
            assembly/ptx/fptx
            assembly/numfmt/fnumfmt
            assembly/dd/fdd
            assembly/csplit/fcsplit
            assembly/expr/fexpr
            assembly/test/ftest
            assembly/install/finstall
            assembly/ls/fls
            assembly/dir/fdir
            assembly/vdir/fvdir
            assembly/du/fdu
            assembly/df/fdf
            assembly/mkdir/fmkdir
            assembly/mkfifo/fmkfifo
            assembly/mknod/fmknod
            assembly/mktemp/fmktemp
            assembly/chmod/fchmod
            assembly/basename/fbasename
            assembly/cksum/fcksum
            assembly/dirname/fdirname
            assembly/factor/ffactor
            assembly/link/flink
            assembly/nproc/fnproc
            assembly/pathchk/fpathchk
            assembly/printenv/fprintenv
            assembly/readlink/freadlink
            assembly/rmdir/frmdir
            assembly/sum/fsum
            assembly/tee/ftee
            assembly/truncate/ftruncate
            assembly/uname/funame
            assembly/unlink/funlink
            assembly/base32/fbase32
            assembly/basenc/fbasenc
            assembly/comm/fcomm
            assembly/fold/ffold
            assembly/join/fjoin
            assembly/pr/fpr
            assembly/sha1sum/fsha1sum
            assembly/sha256sum/fsha256sum
            assembly/shred/fshred
            assembly/shuf/fshuf
            assembly/tsort/ftsort
            assembly/sha512sum/fsha512sum
            assembly/b2sum/fb2sum
            assembly/split/fsplit
            assembly/kill/fkill
            assembly/nohup/fnohup
            assembly/touch/ftouch
            assembly/uptime/fuptime
            assembly/users/fusers
            assembly/who/fwho
            assembly/chown/fchown

  # ── Assembly: test each tool in parallel ──────
  # Skip on merge_group — tests already passed on the PR.
  assembly-test:
    if: github.event_name != 'merge_group'
    name: Test asm/${{ matrix.tool }}
    needs: assembly-build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        tool: [yes, true, arch, logname, hostid, tty, whoami, pwd, sync, sleep, echo, head, tail, tac, rev, wc, cut, tr, base64, md5sum, cat, expand, false, nl, od, seq, sort, unexpand, uniq, paste, sha224sum, sha384sum, nice, date, timeout, env, groups, id, ln, rm, mv, cp, stat, realpath, dircolors, printf, chroot, chcon, runcon, stty, stdbuf, pinky, ptx, numfmt, dd, csplit, expr, test, install, ls, dir, vdir, du, df, mkdir, mkfifo, mknod, mktemp, chmod, basename, cksum, dirname, factor, link, nproc, pathchk, printenv, readlink, rmdir, sum, tee, truncate, uname, unlink, base32, basenc, comm, fold, join, pr, sha1sum, sha256sum, sha512sum, shred, shuf, tsort, b2sum, split, kill, nohup, touch, uptime, users, who, chown]
        runner: [ubuntu-latest]
        include:
          - tool: yes-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8
        if: matrix.tool != 'yes-arm64'
        with:
          name: assembly-binaries
          path: assembly
      - name: Setup
        if: matrix.tool != 'yes-arm64'
        run: |
          chmod +x assembly/${{ matrix.tool }}/f${{ matrix.tool }}
          sudo apt-get install -y --no-install-recommends strace
      - name: Functional tests
        if: matrix.tool != 'yes-arm64'
        run: |
          if [ "${{ matrix.tool }}" = "yes" ]; then
            cd assembly/yes
            python3 ../../tests/assembly/fyes_vs_yes_tests.py --test-only
          else
            bash assembly/${{ matrix.tool }}/tests/run_tests.sh ./assembly/${{ matrix.tool }}/f${{ matrix.tool }}
          fi
      - name: Security tests
        if: matrix.tool != 'yes' && matrix.tool != 'yes-arm64'
        run: python3 assembly/${{ matrix.tool }}/tests/security_tests.py
      - name: Build ARM64 fyes
        if: matrix.tool == 'yes-arm64'
        run: |
          as -o /tmp/fyes_arm64.o assembly/yes/fyes_arm64.s
          ld -static -s -e _start -o /tmp/fyes_arm64 /tmp/fyes_arm64.o
          chmod +x /tmp/fyes_arm64
      - name: Test ARM64 fyes
        if: matrix.tool == 'yes-arm64'
        run: |
          /tmp/fyes_arm64 | head -5
          /tmp/fyes_arm64 hello | head -3
          /tmp/fyes_arm64 --help
          /tmp/fyes_arm64 --version
          echo "All ARM64 assembly fyes smoke tests passed."
