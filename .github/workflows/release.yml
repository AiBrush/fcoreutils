name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  calculate-version:
    name: Calculate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      publish_crates: ${{ steps.calc.outputs.publish_crates }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate next version
        id: calc
        env:
          BUMP_TYPE: ${{ inputs.bump_type || 'patch' }}
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [[ -z "$latest" ]]; then
            latest="v0.0.0"
          fi
          echo "Latest tag: $latest"

          version="${latest#v}"
          IFS='.' read -r major minor patch <<< "$version"

          bump="$BUMP_TYPE"
          echo "Bump type: $bump"

          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          # Auto-promote: every 10 patches, bump to minor release instead.
          # Minor releases also publish to crates.io. Patch releases are
          # GitHub-only to stay within crates.io daily rate limits.
          publish_crates="false"
          if [[ "$bump" == "patch" && $((patch % 10)) -eq 0 && $patch -gt 0 ]]; then
            echo "Auto-promoting patch $patch to minor release (every 10 patches)"
            minor=$((minor + 1))
            patch=0
            publish_crates="true"
          fi
          # Manual minor/major bumps also publish to crates.io
          if [[ "$bump" == "minor" || "$bump" == "major" ]]; then
            publish_crates="true"
          fi

          new_version="${major}.${minor}.${patch}"
          new_tag="v${new_version}"
          echo "New version: $new_version (tag: $new_tag)"
          echo "Publish to crates.io: $publish_crates"

          if git rev-parse "$new_tag" >/dev/null 2>&1; then
            echo "::error::Tag $new_tag already exists!"
            exit 1
          fi

          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"
          echo "publish_crates=$publish_crates" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: [calculate-version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: Linux x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: Linux ARM64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macOS x86_64
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macOS ARM64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows x86_64

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.cross && matrix.target || '' }}

      - name: Set version
        shell: bash
        env:
          NEW_VERSION: ${{ needs.calculate-version.outputs.version }}
        run: |
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' "s/^version = \".*\"/version = \"$NEW_VERSION\"/" Cargo.toml
          else
            sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" Cargo.toml
          fi

      - name: Set RUSTFLAGS for target CPU
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          case "$BUILD_TARGET" in
            x86_64-*)
              echo "RUSTFLAGS=-C target-cpu=x86-64-v3" >> "$GITHUB_ENV"
              ;;
            aarch64-*)
              echo "RUSTFLAGS=-C target-cpu=generic" >> "$GITHUB_ENV"
              ;;
            *)
              echo "RUSTFLAGS=" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Install nasm and libssl-dev (Linux, macOS x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'x86_64-apple-darwin'
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          if [[ "$OSTYPE" == "linux"* ]]; then
            if [[ "$BUILD_TARGET" == "x86_64-unknown-linux-gnu" ]]; then
              sudo apt-get install -y --no-install-recommends nasm libssl-dev
            else
              sudo apt-get install -y --no-install-recommends libssl-dev
            fi
          else
            brew install nasm || true
          fi

      - name: Build
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          if [[ "$OSTYPE" == "linux"* ]]; then
            OPENSSL_STATIC=1 cargo build --release --target "$BUILD_TARGET"
          else
            cargo build --release --target "$BUILD_TARGET"
          fi

      - name: Create release archive
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_OS: ${{ matrix.os }}
        run: |
          mkdir -p release
          BINDIR="target/$BUILD_TARGET/release"
          if [[ "$BUILD_OS" == "windows-latest" ]]; then
            # Copy ALL f* binaries (not just a hardcoded subset)
            for bin in "${BINDIR}"/f*.exe; do
              [ -f "$bin" ] && cp "$bin" release/
            done
            7z a "fcoreutils-$BUILD_TARGET.zip" release/*
          else
            # Copy ALL f* binaries (not just a hardcoded subset)
            for bin in "${BINDIR}"/f*; do
              [ -f "$bin" ] && [ -x "$bin" ] && [[ "$(basename "$bin")" != *.* ]] && cp "$bin" release/
            done
            tar -czf "fcoreutils-$BUILD_TARGET.tar.gz" -C release .
          fi
          echo "Packaged $(ls release/ | wc -l) binaries:"
          ls release/ | head -20
          echo "..."

      - name: Upload archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: release-${{ matrix.target }}
          path: fcoreutils-*

  publish:
    name: Publish
    needs: [calculate-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create and push tag
        env:
          RELEASE_TAG: ${{ needs.calculate-version.outputs.tag }}
        run: |
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        if: needs.calculate-version.outputs.publish_crates == 'true'

      - name: Publish to crates.io
        if: needs.calculate-version.outputs.publish_crates == 'true'
        continue-on-error: true
        env:
          NEW_VERSION: ${{ needs.calculate-version.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" Cargo.toml
          cargo publish --allow-dirty --token "$CARGO_REGISTRY_TOKEN"

      - name: Download all artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: 'dist/*'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.calculate-version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --title "$RELEASE_TAG" \
            --generate-notes
